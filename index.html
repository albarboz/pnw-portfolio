<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title, description and link-preview tags are written in at build time from site.meta (vite.config.ts),
         so link previews and search engines see them without JS. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- the browser's toolbar on phones, in --night (src/styles/tokens.css) -->
    <meta name="theme-color" content="#0e1310" />
  </head>
  <body>
    <!-- Text and images are filled from src/content/site.ts (data-text / data-img). -->

    <!-- Site header (src/ui/header.ts): fades in as the trail run reaches About, marks the section in view -->
    <header class="site-header" data-header>
      <div class="wrap header-in">
        <nav data-header-nav><ul></ul></nav>
      </div>
    </header>

    <main>
      <!-- Scene: descent (src/scenes/descent.ts) -->
      <section class="scene" data-scene="descent" aria-label="Introduction">
        <div class="stage" data-stage>
          <img class="overlook" data-layer="overlook" data-img="descent.overlook" alt="" fetchpriority="high" />
          <!-- Layered overlook: far and mid sit behind the fog, near in front of it. Filled in by descent.ts. -->
          <img class="overlook" data-overlook-part="far" alt="" hidden />
          <!-- The far layer's sharper middle, blended in as the dive zooms: src/effects/overlook.ts -->
          <img class="overlook" data-overlook-part="detail" alt="" hidden />
          <img class="overlook" data-overlook-part="mid" alt="" hidden />
          <!-- Far and mid in 3D (relief meshes from their depth maps), taking over from the flat cutouts at rest: src/effects/overlook.ts -->
          <canvas data-layer="overlook-3d" aria-hidden="true"></canvas>
          <div class="overlook-veil" aria-hidden="true"></div>
          <canvas data-fog="high" aria-hidden="true"></canvas>
          <img class="overlook" data-overlook-part="near" alt="" hidden />
          <!-- The white-out, with soft banks of cloud inside it that swell past as the camera flies through -->
          <div class="whiteout" data-layer="whiteout" aria-hidden="true"><div class="whiteout-drift" data-layer="drift"></div></div>
          <div class="landing-wrap" data-layer="landing-wrap">
            <img data-layer="landing" data-img="descent.landing" data-defer alt="" />
            <canvas data-layer="landing-depth" hidden aria-hidden="true"></canvas>
            <div class="landing-shade" aria-hidden="true"></div>
          </div>
          <canvas data-fog="low" aria-hidden="true"></canvas>
          <!-- Film grain over every picture layer, below the text: src/effects/grain.ts -->
          <div class="grain" data-layer="grain" aria-hidden="true"><div class="grain-tile"></div></div>

          <div class="hero-copy" data-layer="hero">
            <h1><span data-text="name.first"></span> <span data-text="name.last"></span></h1>
            <p data-text="tagline"></p>
            <!-- Trail sign: planks filled from site.sign by src/ui/trail-sign.ts -->
            <nav class="trail-sign" data-sign>
              <ul></ul>
            </nav>
          </div>

          <!-- Scroll hint: visual only (the page scrolls like any other); fades out with the hero -->
          <div class="scroll-cue" data-layer="cue" aria-hidden="true">
            <span class="scroll-cue-in">
              <span data-text="ui.scrollCue"></span>
              <span class="cue-blazes"><span class="blaze"></span><span class="blaze"></span><span class="blaze"></span></span>
            </span>
          </div>

          <div class="caption cap-fog" data-layer="cap-fog">
            <p data-text="descent.fogCaption.text"></p>
          </div>
          <div class="caption cap-landing" data-layer="cap-landing">
            <p data-text="descent.landingCaption.text"></p>
          </div>
        </div>
      </section>

      <!-- Scene: the trail run (src/scenes/run.ts), filled from site.run. Its stage sticks to the screen behind the
           sections: it rises over the end of the descent, opens on the trail photo in a ring of fog, and the scroll
           runs the film through the gaps ([data-run-gap]). Each section tells it how to behave ([data-run]):
           read = slow down and step aside for the text, sheet = stop behind a sheet that rises over it,
           end = run out and hold the last frame. -->
      <div class="run" id="run" data-scene="run">
        <h2 class="sr-only" data-text="run.label"></h2>
        <p class="sr-only" data-text="run.description"></p>
        <div class="stage" data-stage>
          <canvas data-layer="run-gl" hidden aria-hidden="true"></canvas>
          <video data-layer="run-video" muted playsinline preload="none" hidden aria-hidden="true"></video>
          <img class="run-still" data-layer="run-still" alt="" hidden />
          <!-- Everything over the film fades in with it, so nothing shows on the trail photo before the hand-off -->
          <div class="run-fx" data-layer="fx" aria-hidden="true">
            <!-- Film grain like the descent's (src/effects/grain.ts) -->
            <div class="grain" data-layer="grain"><div class="grain-tile"></div></div>
            <!-- shade on the text's side of the screen while a section reads over the film -->
            <div class="run-scrim" data-layer="scrim"></div>
          </div>
        </div>
        <div class="run-gap" data-run-gap></div>
        <section class="section about" id="about" aria-labelledby="about-h">
          <div class="wrap about-body" data-run="read">
            <!-- data-reveal sits on a wrapper so the heading itself is free for the drift (src/ui/reveal.ts) -->
            <div data-reveal><h2 id="about-h" class="blazed" data-text="about.heading" data-drift></h2></div>
            <div class="about-text" data-reveal>
              <span class="label" data-text="about.label"></span>
              <div data-about-body></div>
            </div>
          </div>
        </section>

        <div class="run-gap" data-run-gap></div>
        <section class="section work" id="work" aria-labelledby="work-h">
          <div class="wrap" data-run="sheet">
            <div class="sec-head" data-reveal>
              <h2 id="work-h" class="blazed" data-text="work.heading" data-drift></h2>
              <span class="label" data-text="work.label"></span>
            </div>
            <ul class="work-list" data-projects></ul>
          </div>
        </section>

        <div class="run-gap" data-run-gap></div>

        <!-- The arrival: the run holds its last frame and Contact fills the screen over it -->
        <section class="section contact" id="contact" aria-labelledby="contact-h">
          <div class="wrap contact-body" data-run="end">
            <div data-reveal>
              <h2 id="contact-h" class="blazed" data-text="contact.heading"></h2>
              <span class="label" data-text="contact.label"></span>
            </div>
            <p class="lead" data-reveal>
              <span data-text="contact.leadBefore"></span>
              <em data-text="contact.leadEmphasis"></em>
              <span data-text="contact.leadAfter"></span>
            </p>
            <div class="email-row" data-reveal>
              <a class="email" data-email data-text="contact.email"></a>
              <button class="copy blazed" type="button" data-copy-email data-text="ui.copyEmail.label"></button>
              <span class="sr-only" role="status" data-copy-status></span>
            </div>
            <ul class="contact-links" data-contact-links data-reveal></ul>
          </div>
          <footer class="wrap site-footer">
            <span data-footer-name></span>
            <span class="credits" data-credits></span>
            <a class="to-top blazed" href="#top" data-fly-top data-text="ui.toTop"></a>
          </footer>
        </section>
      </div>
    </main>

    <!-- Project detail view (src/ui/project-dialog.ts), filled from site.work.projects -->
    <dialog class="project-dialog" aria-labelledby="pd-title" data-project-dialog data-lenis-prevent>
      <div class="pd-scrim" data-pd="scrim" aria-hidden="true"></div>
      <div class="pd-scroll" data-pd="scroll">
        <article class="pd-panel" data-pd="panel">
          <div class="pd-sheet" data-pd="sheet" aria-hidden="true"></div>
          <header class="pd-head" data-pd-fade>
            <button class="pd-close" type="button" data-pd="close" data-text="work.detail.close"></button>
          </header>
          <h2 class="pd-title" id="pd-title" data-pd="title"></h2>
          <p class="pd-meta meta" data-pd="meta" data-pd-fade></p>
          <img class="pd-image" data-pd="image" data-pd-fade alt="" hidden />
          <div class="pd-body" data-pd="body" data-pd-fade></div>
          <dl class="pd-facts" data-pd="facts" data-pd-fade></dl>
          <div class="pd-links" data-pd="links" data-pd-fade></div>
        </article>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
